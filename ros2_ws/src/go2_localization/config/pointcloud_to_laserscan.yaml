/**:
  pointcloud_to_laserscan:
    ros__parameters:
      use_sim_time: true

      # chin_lidar_frameは実機仮値でpitch=0.35rad(約20°)下向きに傾いているため、
      # 空文字(=センサ自身の傾いた座標系のまま高さで輪切り)にすると水平でない
      # 斜めの面で切ることになり、歩くたびに形が変わる不安定なスキャンになる。
      # base_linkに変換してから輪切りにすることで、傾きを補正する
      target_frame: "base_link"
      transform_tolerance: 0.05

      # Issue #56: 入力(cloud_in、launchファイルでremap)はheight_slice_vizが理論床到達
      # 距離との比較で床を除去した後の点群(/go2_localization/chin_lidar_scan_points)。
      # 高さでの二重フィルタを避けるため、ここではheight_slice_viz側のmax_height(0.3)を
      # 覆うくらい広く取り、実質「床除去済みの点群の中から角度ごとに最も近い点を採用する」
      # だけの役割にする。至近距離の自己ノイズ(脚等)はrange_minで別途弾く
      min_height: -2.0
      max_height: 1.0

      angle_min: -3.14159265
      angle_max: 3.14159265
      angle_increment: 0.0087
      scan_time: 0.1
      # 脚(0.13〜0.3m)の近距離ノイズを除外(Issue #26)
      range_min: 0.4
      range_max: 30.0
      use_inf: true
      concurrency_level: 1

  # height_slice_viz: 単純な高さレンジではなく、レイごとの理論上の床到達距離との比較で
  # 床を除去する(Issue #26)。この出力(chin_lidar_scan_points)はAMCL本体が使う
  # pointcloud_to_laserscanのcloud_inにもなっている(Issue #56)。詳細は
  # height_slice_viz.pyのdocstring参照
  height_slice_viz:
    ros__parameters:
      use_sim_time: true
      target_frame: "base_link"
      # 床の高さ(target_frame相対)。cafe_worldの平地で静止スキャンした実測値
      # (前方0.5〜2.0mで一貫してz=-0.26〜-0.28だった)から-0.27とした
      floor_z: -0.27
      # 理論上の床到達距離より、これ以上手前で反射していれば障害物とみなすマージン
      floor_margin: 0.3
      # 参考程度の粗い上限(天井反射等の除外用)
      max_height: 0.3
