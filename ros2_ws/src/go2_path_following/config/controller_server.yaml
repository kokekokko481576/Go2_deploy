/**:
  controller_server:
    ros__parameters:
      use_sim_time: true

      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      # Issue #22: DWB(FollowPath)とMPPI(FollowPathMPPI)を同時ロードし、
      # plan_followerのcontroller_idパラメータ(FollowPathアクションのcontroller_id)で
      # 切り替えて比較する(再起動不要)。既定はDWB
      controller_plugins: ["FollowPath", "FollowPathMPPI"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.2

      # external/go2_ros2_sim_py/gazebo_sim/config/nav2_params.yaml の
      # controller_server.FollowPath(DWB)ブロックを参考値としてそのまま流用
      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: true
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.18
        max_vel_y: 0.0
        max_vel_theta: 0.5
        min_speed_xy: 0.0
        max_speed_xy: 0.18
        min_speed_theta: 0.0
        acc_lim_x: 2.5
        acc_lim_y: 0.0
        acc_lim_theta: 3.2
        decel_lim_x: -2.5
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        vx_samples: 20
        vy_samples: 5
        vtheta_samples: 20
        sim_time: 1.7
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.2
        xy_goal_tolerance: 0.25
        trans_stopped_velocity: 0.25
        short_circuit_trajectory_evaluation: true
        limit_vel_cmd_in_traj: false
        stateful: true
        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        BaseObstacle.scale: 0.02
        PathAlign.scale: 32.0
        GoalAlign.scale: 24.0
        PathAlign.forward_point_distance: 0.1
        GoalAlign.forward_point_distance: 0.1
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0

      # Issue #22: MPPIとの比較用。速度上限はDWB(FollowPath)と揃える
      # (max_vel_x/theta同値。vy_max=0は本ロボットがy方向を使わない前提もDWBと共通)。
      # external/go2_ros2_sim_py/gazebo_sim/config/nav2_params.yaml のコメントアウト済み
      # MPPIブロックを土台に、本ロボットの速度域(vx_max=0.18)へ合わせた
      FollowPathMPPI:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 56
        model_dt: 0.05
        batch_size: 2000
        vx_std: 0.1
        vy_std: 0.0
        wz_std: 0.3
        vx_max: 0.18
        vx_min: -0.18
        vy_max: 0.0
        wz_max: 0.5
        iteration_count: 1
        prune_distance: 2.5
        transform_tolerance: 0.2
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        visualize: false
        regenerate_noises: false
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        critics: [
          "ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
          "CostCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
          "PreferForwardCritic",
        ]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.4
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          critical_cost: 300.0
          consider_footprint: true
          collision_cost: 1000000.0
          near_collision_cost: 253
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
        ObstaclesCritic:
          enabled: true
          cost_power: 1
          repulsion_weight: 1.5
          critical_weight: 20.0
          consider_footprint: true
          collision_cost: 10000.0
          collision_margin_distance: 0.1
          near_goal_distance: 0.5

  # 追M3(Issue #23): 地図にない障害物をローカルだけで回避するため、
  # obstacle_layer(顎LiDAR)+inflation_layerの5m四方ローリングにする。
  # 既知の地図情報は生M3(#18)のglobal_costmap(static_layer)側の役割なので、
  # ここではstatic_layerを持たない(obstacle+inflationのみ、と#23本文で明記)
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 5
        height: 5
        resolution: 0.05
        footprint: "[ [0.35, 0.18], [0.35, -0.18], [-0.38, -0.18], [-0.38, 0.18] ]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          # global_costmap(go2_path_planning/config/planner_server.yaml)の
          # obstacle_layerと同じ観測源・設定(#18で確定済みの値をそのまま流用)
          observation_sources: chin_lidar_scan
          chin_lidar_scan:
            topic: /go2_localization/chin_lidar_scan
            sensor_frame: base_link
            data_type: "LaserScan"
            marking: true
            clearing: true
            obstacle_max_range: 10.0
            obstacle_min_range: 0.4
            raytrace_max_range: 10.5
            raytrace_min_range: 0.4
            inf_is_valid: true
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 4.0
          inflation_radius: 0.45
        always_send_full_costmap: true

  lifecycle_manager_navigation:
    ros__parameters:
      use_sim_time: true
      autostart: true
      node_names: ["controller_server"]
