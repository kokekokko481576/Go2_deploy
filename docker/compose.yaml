services:
  ros2:
    build: .
    image: arbeit-ros2:humble
    container_name: arbeit-ros2
    # ros2_ws はホスト側(リポジトリ直下)に置き、コンテナを消してもコードが残るようにする
    volumes:
      - ../ros2_ws:/home/ros/ros2_ws
      # --- Ubuntu で GUI を使う場合(ネイティブX11) ---
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      # --- iGPU(/dev/dri)をコンテナに渡す。NVIDIA不要、GPU非力機のGazebo/RViz2描画支援用 ---
      - /dev/dri:/dev/dri
    environment:
      # [Ubuntu] ネイティブX11。ホストで事前に `xhost +local:docker` を実行しておく(docker/README.md 参照)
      - DISPLAY=${DISPLAY}
      # [Mac] GUI(RViz/Gazebo)は XQuartz 経由。上のDISPLAY行をコメントアウトし、
      #   xhost +localhost を実行してから次を有効化する
      # - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      # 実機Go2と接続する場合、driver側のGO2_NICと同じNIC名を指定する(例: enp3s0)。
      # 未指定ならCycloneDDSの既定インタフェース選択のまま(sim/loopbackでの現状動作を変えない)。
      # driverコンテナ側の狙いと同じ理由(docker/driver/setup_dds.sh参照): 複数NIC搭載機で
      # dev/driver各コンテナが別々のNICを自動選択し、DDS発見に失敗するのを防ぐため。
      - GO2_NIC=${GO2_NIC:-}
      - CYCLONEDDS_URI=${GO2_NIC:+<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="${GO2_NIC}" priority="default" multicast="default" /></Interfaces></General></Domain></CycloneDDS>}
    stdin_open: true
    tty: true
    command: zsh
    # 実機Go2(有線LAN・DDS)と通信する場合や、Ubuntuネイティブでの利用はホストネットワークを使う(推奨)。
    # [Mac] Docker Desktop 4.34以降 + 設定で "Enable host networking" を有効化が必要
    network_mode: host
    # --- Ubuntu + NVIDIA GPU 機で描画を速くする場合(nvidia-container-toolkit 導入後) ---
    # gpus: all
